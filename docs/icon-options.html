<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentWorld — خيارات الأيقونة</title>
<style>
  :root { --bg:#f5f7f3; --card:#fff; --text:#142030; --muted:#5b6675; --line:#dde3dc; --accent:#127c6e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1620; --card:#17212e; --text:#eef2ee; --muted:#9aa7b6; --line:#2a3646; } }
  * { box-sizing:border-box }
  body { margin:0; padding:24px 16px 80px; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto }
  h1 { font-size:22px; margin:0 0 4px } p.sub { color:var(--muted); margin:0 0 20px; font-size:14px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px }
  .card { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; text-align:start; font:inherit; color:inherit }
  .card:hover { border-color:var(--accent) } .card[aria-pressed=true] { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent) }
  .num { font-weight:700; font-size:13px; color:var(--accent) } .name { font-weight:600; margin:2px 0 2px } .desc { font-size:12.5px; color:var(--muted); margin-bottom:10px; min-height:34px }
  .big { display:flex; justify-content:center; padding:10px 0 }
  .sizes { display:flex; align-items:flex-end; justify-content:center; gap:14px; padding:10px; border-radius:10px; background:#e9edf0 }
  .sizes.dark { background:#2b2f36; margin-top:6px }
  .tab { display:flex; align-items:center; gap:6px; margin-top:6px; padding:6px 10px; border-radius:8px 8px 0 0; background:#fff; color:#222; font-size:12px; direction:ltr; width:fit-content }
  .bar { position:fixed; inset-inline:0; bottom:0; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:14px }
  button.act { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer }
</style>
</head>
<body>
<div class="wrap">
  <h1>خيارات أيقونة AgentWorld</h1>
  <p class="sub">اضغط على التصميم الذي يعجبك. كل تصميم معروض بحجم كبير وبأحجام التبويب (16 / 32 / 48) على خلفية فاتحة وداكنة.</p>
  <div class="grid" id="grid"></div>
</div>
<div class="bar"><span id="sel">لم تختر بعد</span><button class="act" id="copy" disabled>نسخ كود SVG</button></div>

<script>
const T="#127c6e", A="#f2b544", I="#142030", W="#f5f7f3";
const designs = [
 {n:"1 — المدينة (الحالي)", d:"الشعار الحالي في التطبيق: مبنيان. التفاصيل صغيرة وقد تضيع عند 16px.",
  s:`<rect width="32" height="32" rx="9" fill="${T}"/><path d="M7 23V14.5L12.5 10L18 14.5V23Z" fill="${W}"/><path d="M18 23V8.5H25V23Z" fill="${A}"/><rect x="10.5" y="17" width="4" height="6" rx="1" fill="${T}"/><rect x="20" y="11" width="3" height="2.4" rx=".6" fill="${I}" opacity=".55"/><rect x="20" y="15" width="3" height="2.4" rx=".6" fill="${I}" opacity=".55"/>`},
 {n:"2 — المدينة المبسّطة", d:"نفس الفكرة بدون تفاصيل: كتلتان جريئتان، الأوضح عند الحجم الصغير.",
  s:`<rect width="32" height="32" rx="9" fill="${T}"/><path d="M5 25V15L11 9.5L17 15V25Z" fill="${W}"/><rect x="18" y="6" width="9" height="19" rx="1.5" fill="${A}"/>`},
 {n:"3 — العالم والوكلاء", d:"كرة (World) يدور حولها مدار وعقدة وكيل. تعبّر عن الاسم مباشرة.",
  s:`<rect width="32" height="32" rx="9" fill="${I}"/><circle cx="16" cy="16" r="8" fill="none" stroke="${T}" stroke-width="3"/><ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="${W}" stroke-width="1.8" transform="rotate(-25 16 16)"/><circle cx="25.5" cy="11" r="3" fill="${A}"/>`},
 {n:"4 — شبكة الوكلاء", d:"محور مركزي وثلاث عقد: تمثل نظام وكلاء يعملون معاً.",
  s:`<rect width="32" height="32" rx="9" fill="${T}"/><g stroke="${W}" stroke-width="2" stroke-linecap="round"><path d="M16 16L8 9M16 16L24 9M16 16V25"/></g><circle cx="16" cy="16" r="4.5" fill="${A}"/><circle cx="8" cy="9" r="3" fill="${W}"/><circle cx="24" cy="9" r="3" fill="${W}"/><circle cx="16" cy="25" r="3" fill="${W}"/>`},
 {n:"5 — حرفا AW", d:"مونوغرام نصّي: الأبسط والأكثر احترافية، لكنه أقل تعبيراً عن الفكرة.",
  s:`<rect width="32" height="32" rx="9" fill="${I}"/><path d="M4.5 24L10 8h2.4L18 24h-2.7l-1.3-4H8.5l-1.3 4zM9.2 17.8h4.1L11.2 11.4z" fill="${W}"/><path d="M17 8l2.4 11 2.5-8h1.8l2.5 8L28.600 8h2.4l-3.400 16h-2.200l-2.300-7.300L20.800 24h-2.200z" fill="${A}" transform="translate(-3.500 0) scale(.92 1) translate(1 0)"/>`},
 {n:"6 — وجه روبوت", d:"رأس روبوت بهوائي. واضح أنه ذكاء اصطناعي، لكنه شائع جداً (أقل تميزاً).",
  s:`<rect width="32" height="32" rx="9" fill="${T}"/><path d="M16 5v4" stroke="${A}" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="4.800" r="1.800" fill="${A}"/><rect x="6" y="9" width="20" height="17" rx="5" fill="${W}"/><circle cx="12" cy="16.500" r="2.400" fill="${I}"/><circle cx="20" cy="16.500" r="2.400" fill="${I}"/><rect x="11.500" y="21" width="9" height="1.800" rx=".9" fill="${T}"/>`},
 {n:"7 — مكعب المدينة", d:"كتلة ثلاثية الأبعاد (isometric) بألوان الهوية: توحي بعالم محاكاة.",
  s:`<rect width="32" height="32" rx="9" fill="${I}"/><path d="M16 5L26 10.500V21.500L16 27L6 21.500V10.500Z" fill="${T}"/><path d="M16 16L6 10.500L16 5L26 10.500Z" fill="${W}"/><path d="M16 16V27L6 21.500V10.500Z" fill="${T}"/><path d="M16 16V27L26 21.500V10.500Z" fill="${A}"/>`},
 {n:"8 — سداسي A", d:"سداسي مع حرف A مجرد وعقدة: شكل تقني نظيف يميّز المنتج.",
  s:`<rect width="32" height="32" rx="9" fill="${I}"/><path d="M16 4L26.500 10V22L16 28L5.500 22V10Z" fill="${T}"/><path d="M10.500 21L16 9.500L21.500 21" fill="none" stroke="${W}" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.200" fill="${A}"/>`}
];
const svg=(s,px)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="${px}" height="${px}">${s}</svg>`;
const grid=document.getElementById("grid"); let chosen=null;
designs.forEach((d,i)=>{
  const b=document.createElement("button"); b.className="card"; b.setAttribute("aria-pressed","false");
  b.innerHTML=`<div class="num">خيار ${i+1}</div><div class="name">${d.n.split(" — ")[1]}</div><div class="desc">${d.d}</div>
  <div class="big">${svg(d.s,112)}</div>
  <div class="sizes">${[16,32,48].map(p=>svg(d.s,p)).join("")}</div>
  <div class="sizes dark">${[16,32,48].map(p=>svg(d.s,p)).join("")}</div>
  <div class="tab">${svg(d.s,16)}<span>AgentWorld — Operator Console</span></div>`;
  b.onclick=()=>{chosen=i;[...grid.children].forEach((c,j)=>c.setAttribute("aria-pressed",j===i));
    document.getElementById("sel").textContent="اخترت: خيار "+(i+1)+" — "+d.n.split(" — ")[1]; document.getElementById("copy").disabled=false;};
  grid.appendChild(b);
});
document.getElementById("copy").onclick=async()=>{ if(chosen===null) return;
  const code=svg(designs[chosen].s,32).replace(' width="32" height="32"',''); try{await navigator.clipboard.writeText(code); document.getElementById("copy").textContent="تم النسخ";}catch(e){prompt("انسخ الكود:",code);} };
</script>
</body>
</html>
