# King World CI — mirrors `npm run verify` (typecheck -> lint -> test -> build).
#
# Test isolation: every job gets its own database file via TEST_DATABASE_URL
# (see tests/setup.ts), so matrix jobs and concurrent runs never share state.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    env:
      TEST_DATABASE_URL: "file:./test-ci-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_id }}.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
