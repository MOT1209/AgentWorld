# AgentWorld CI — mirrors `npm run verify` (typecheck -> lint -> test -> build).
#
# Test isolation: every job gets its own database file via TEST_DATABASE_URL
# (see tests/setup.ts), so matrix jobs and concurrent runs never share state.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the older run.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    env:
      TEST_DATABASE_URL: "file:./test-ci-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_id }}.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Real container-boundary tests (tests/docker-sandbox.test.ts) need Docker;
      # they self-skip on the Windows leg.
      - name: Build sandbox image
        if: runner.os == 'Linux'
        run: |
          docker build -t kingworld-sandbox:1 docker/sandbox
          echo "TEST_DOCKER_IMAGE=kingworld-sandbox:1" >> "$GITHUB_ENV"
      - run: npm run check:docs
      # Production dependencies only; fails on high or critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Builds the production image and proves it boots, migrates, seeds, serves the dashboard and accepts a
  # login. Separate from the test matrix so a Docker problem never hides a test result.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentworld:ci .
      - name: Smoke test
        run: |
          set -eu
          docker run -d --name agentworld -p 4000:4000 \
            -e JWT_SECRET="$(openssl rand -hex 48)" \
            -e VAULT_MASTER_KEY="$(openssl rand -base64 32)" \
            -e SEED_OWNER_EMAIL=ci@agentworld.local \
            -e SEED_OWNER_PASSWORD=ci-Password-2026 \
            -e EXEC_SANDBOX=local \
            agentworld:ci
          ready=0
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:4000/ready >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fs http://localhost:4000/health
          curl -fs http://localhost:4000/ | grep -q "<title>AgentWorld"
          token=$(curl -fs -X POST http://localhost:4000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@agentworld.local","password":"ci-Password-2026"}' | jq -r .token)
          test -n "$token" && test "$token" != null
          curl -fs -H "authorization: Bearer $token" http://localhost:4000/api/v1/agents >/dev/null
      - name: Container logs
        if: failure()
        run: docker logs agentworld
